<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../../../public/fonts/geist-latin-wght.woff2') format('woff2'); }
  
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #0a0e14; }
  body { position: relative; overflow: hidden; font-family: 'Geist', sans-serif; color: #e9eef5; }
  .scene { position: absolute; top: 0; left: 210px; width: 1200px; height: 630px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0e14 0, #0a0e14 300px, rgba(10, 14, 20, 0.88) 470px, rgba(10, 14, 20, 0.35) 640px, rgba(10, 14, 20, 0) 760px), linear-gradient(0deg, rgba(10, 14, 20, 0.85) 0, rgba(10, 14, 20, 0) 140px); }
  .content { position: absolute; left: 72px; top: 64px; bottom: 56px; width: 1056px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 14px; font: 600 20px 'Geist'; letter-spacing: 0.08em; text-transform: uppercase; color: #9ba8bb; }
  .mark svg { width: 48px; height: 48px; }
  h1 { margin-top: 56px; font: 700 84px/1.0 'Geist'; letter-spacing: -0.025em; }
  .role { margin-top: 28px; font: 600 32px/1.25 'Geist'; color: #e9eef5; }
  .co { margin-top: 14px; font: 500 28px/1.3 'Geist'; color: #9ba8bb; }
  .co strong { color: #5aa9ff; font-weight: 600; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 28px; font: 600 22px 'Geist'; color: #c9d3e0; }
  .foot i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 1px; }
  .url { margin-left: auto; color: #e9eef5; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #5aa9ff; }
</style>
</head>
<body>
  <img class="scene" alt="" />
  <div class="shade"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#111723" /><path d="M43.5 22.4A15 15 0 1 0 43.5 41.6" fill="none" stroke="#e9eef5" stroke-width="8" /><circle cx="47" cy="32" r="4.5" fill="#5aa9ff" /></svg>
      <span data-i18n="kicker"></span>
    </div>
    <h1>Carlos<br />Orbegoso</h1>
    <p class="role">Backend Developer<br />Java / Quarkus</p>
    <p class="co" data-i18n-html="co"></p>
    <div class="foot">
      <span><i style="background:#f0a43c"></i>SkyMek</span>
      <span><i style="background:#f28ba0"></i>Parati</span>
      <span><i style="background:#3fcf8e"></i>Ventixs</span>
      <span class="url">carlosorbegoso.github.io/page</span>
    </div>
  </div>
  <script>
    const t = {
      es: { kicker: 'Portafolio', co: 'Cofundador de <strong>TUSOCIO IA</strong>' },
      en: { kicker: 'Portfolio', co: 'Co-founder of <strong>TUSOCIO IA</strong>' }
    }[new URLSearchParams(location.search).get('lang') || 'es'];
    document.querySelector('[data-i18n="kicker"]').textContent = t.kicker;
    document.querySelector('[data-i18n-html="co"]').innerHTML = t.co;
  </script>
</body>
</html>
