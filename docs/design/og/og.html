<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Sora'; font-weight: 100 800; src: url('../../../public/fonts/sora-latin-wght.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('../../../public/fonts/inter-latin-wght.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #0a0e14; }
  body { position: relative; overflow: hidden; font-family: 'Inter', sans-serif; color: #e9eef5; }
  .art { position: absolute; inset: 0; }
  .content { position: absolute; left: 80px; top: 72px; bottom: 64px; width: 720px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 14px; font: 600 20px 'Sora'; letter-spacing: 0.08em; text-transform: uppercase; color: #9ba8bb; }
  .mark svg { width: 48px; height: 48px; }
  h1 { margin-top: 64px; font: 600 80px/1.02 'Sora'; letter-spacing: -0.025em; }
  .role { margin-top: 28px; font: 500 32px/1.3 'Inter'; color: #e9eef5; }
  .role span { color: #6a7b94; padding: 0 6px; }
  .co { margin-top: 14px; font: 500 28px/1.3 'Inter'; color: #9ba8bb; }
  .co strong { color: #5aa9ff; font-weight: 600; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 28px; font: 500 20px 'Inter'; color: #9ba8bb; }
  .foot i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; vertical-align: 1px; }
  .url { margin-left: auto; color: #7d8ba0; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #5aa9ff; }
</style>
</head>
<body>
  <svg class="art" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="930" cy="315" r="340" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5aa9ff" stop-opacity="0.16" />
        <stop offset="1" stop-color="#5aa9ff" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#glow)" />
    <g stroke="#24344d" stroke-width="1.5" fill="none">
      <path d="M760 120 L930 80 L1110 150 L1150 330 L1080 520 L900 570 L760 480 L720 300 Z" />
      <path d="M930 80 L930 315 M760 120 L930 315 M1110 150 L930 315 M1150 330 L930 315 M1080 520 L930 315 M900 570 L930 315 M760 480 L930 315 M720 300 L930 315" />
    </g>
    <g fill="#24344d">
      <circle cx="760" cy="120" r="5" /><circle cx="1110" cy="150" r="5" /><circle cx="1150" cy="330" r="5" />
      <circle cx="1080" cy="520" r="5" /><circle cx="900" cy="570" r="5" /><circle cx="760" cy="480" r="5" /><circle cx="720" cy="300" r="5" />
    </g>
    <g transform="translate(930 315)">
      <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#18202e" stroke="#2b3a52" stroke-width="2" />
      <polygon points="0,-130 112,-65 0,0" fill="#2b3a52" />
      <polygon points="-112,-65 0,-130 0,0" fill="#223047" />
      <polygon points="-112,-65 0,0 -112,65" fill="#1b2638" />
      <polygon points="112,-65 112,65 0,0" fill="#24334b" />
      <rect x="-70" y="-6" width="140" height="12" rx="6" fill="#5aa9ff" />
    </g>
    <circle cx="930" cy="80" r="7" fill="#f0a43c" />
    <circle cx="1150" cy="330" r="7" fill="#f28ba0" />
    <circle cx="900" cy="570" r="7" fill="#3fcf8e" />
  </svg>
  <div class="bar"></div>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#111723" /><path d="M43.5 22.4A15 15 0 1 0 43.5 41.6" fill="none" stroke="#e9eef5" stroke-width="8" /><circle cx="47" cy="32" r="4.5" fill="#5aa9ff" /></svg>
      <span data-i18n="kicker"></span>
    </div>
    <h1>Carlos<br />Orbegoso</h1>
    <p class="role">Backend Developer<span>·</span>Java / Quarkus</p>
    <p class="co" data-i18n-html="co"></p>
    <div class="foot">
      <span><i style="background:#f0a43c"></i>SkyMek</span>
      <span><i style="background:#f28ba0"></i>Parati</span>
      <span><i style="background:#3fcf8e"></i>Ventixs</span>
      <span class="url">carlosorbegoso.github.io/page</span>
    </div>
  </div>
  <script>
    const t = {
      es: { kicker: 'Portafolio', co: 'Cofundador de <strong>TUSOCIO IA</strong>' },
      en: { kicker: 'Portfolio', co: 'Co-founder of <strong>TUSOCIO IA</strong>' }
    }[new URLSearchParams(location.search).get('lang') || 'es'];
    document.querySelector('[data-i18n="kicker"]').textContent = t.kicker;
    document.querySelector('[data-i18n-html="co"]').innerHTML = t.co;
  </script>
</body>
</html>
